<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edf3fc" />

    <title>AIP06 · 企业 AI 工作台</title>
    <style>
:root {
  --ink: #172747;
  --muted: #55657e;
  --accent: #0b5bd3;
  --accent-soft: #e7f0ff;
  --surface: #fff;
  --surface-soft: #f6f9fd;
  --line: #e8edf5;
  --success: #086542;
  --success-bg: #eaf7f1;
  --warning: #7a5008;
  --warning-bg: #fff5de;
  --danger: #a62d3a;
  --danger-bg: #fdf0f1;
  --r-sm: 8px;
  --r: 14px;
  --r-lg: 20px;
  --shadow: 0 5px 24px #314d7610;
  --shadow-pop: 0 14px 48px #18335425;
  --space: 16px;
  --motion: 180ms;
  --body: 14px;
  --small: 12px;
  --title: 23px;
  --sidebar: 204px;
  --session: 238px;
  --viewer: 340px;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
  font-family:
    -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", sans-serif;
  color: var(--ink);
  font-size: var(--body);
  font-variant-numeric: tabular-nums;
}
body {
  background:
    radial-gradient(ellipse at 4% 75%, #d3e3ff 0, transparent 45%),
    linear-gradient(115deg, #eaf2ff, #f2f5fa 58%, #e3efff);
  overflow: hidden;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button,
a {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}
a {
  color: inherit;
  text-decoration: none;
}
button {
  border: 0;
  background: none;
}
input,
select,
textarea {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: var(--r-sm);
  padding: 8px 10px;
  min-width: 0;
}
textarea {
  resize: vertical;
}
input:focus,
textarea:focus,
select:focus {
  outline: 2px solid #2674ed50;
  outline-offset: 1px;
}
button:focus-visible,
a:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
button:hover {
  color: var(--accent);
}
button:active {
  transform: translateY(1px);
}
input::placeholder,
textarea::placeholder {
  color: #8997ae;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: var(--title);
  font-weight: 650;
  letter-spacing: -0.4px;
}
h2 {
  font-size: 17px;
  font-weight: 650;
}
h3 {
  font-size: 15px;
  font-weight: 600;
}
p {
  line-height: 1.7;
}
small,
.muted {
  color: var(--muted);
  font-size: var(--small);
}
.ico {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.ico.sm {
  width: 15px;
  height: 15px;
}
.flex {
  display: flex;
  align-items: center;
  gap: 8px;
}
.between {
  justify-content: space-between;
}
.stack {
  display: grid;
  gap: 16px;
}
.grow {
  flex: 1;
  min-width: 0;
}
.hidden {
  display: none !important;
}
.skip {
  position: fixed;
  left: 20px;
  top: -60px;
  background: #fff;
  padding: 12px;
  z-index: 100;
}
.skip:focus {
  top: 12px;
}
.app {
  height: 100dvh;
  padding: 14px;
  display: flex;
  gap: 10px;
}
.sidebar {
  width: var(--sidebar);
  flex: none;
  display: flex;
  flex-direction: column;
  padding: 21px 12px 12px;
  border: 1px solid #ffffffb5;
  border-radius: var(--r-lg);
  background: #ffffff4d;
  overflow: hidden;
  transition: width var(--motion);
}
.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  margin: 0 8px 24px;
  font-size: 23px;
  font-weight: 750;
  letter-spacing: -0.7px;
}
.brand-mark {
  position: relative;
  display: block;
  width: 29px;
  height: 29px;
  flex: none;
}
.brand-mark i {
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: 7px;
  background: #eb69b1;
}
.brand-mark i:nth-child(2) {
  right: 0;
  background: #e993d4;
}
.brand-mark i:nth-child(3) {
  bottom: 0;
  background: #ea73c3;
}
.brand-mark i:nth-child(4) {
  bottom: 0;
  right: 0;
  background: #d97dce;
}
.space-selector {
  width: 100%;
  padding: 10px 7px;
  display: flex;
  gap: 10px;
  align-items: center;
  border-radius: 12px;
  text-align: left;
  margin-bottom: 18px;
}
.space-selector small {
  display: block;
  font-size: 10px;
}
.space-selector b {
  font-size: 13px;
  font-weight: 550;
  display: block;
  margin-top: 3px;
}
.ai-orb {
  display: inline-grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  flex: none;
  color: #6d6adb;
  background: radial-gradient(
    circle at 38% 30%,
    #fff 0,
    #e5f5ff 17%,
    #94d3ff 32%,
    #99a4fa 49%,
    #d6a6f5 65%,
    #faf0fd 76%
  );
  box-shadow:
    inset 0 0 6px #fff,
    0 2px 8px #667bd422;
  position: relative;
}
.ai-orb:before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1.5px solid #ffffffc9;
  border-radius: 6px;
  transform: rotate(30deg);
}
.ai-orb .ico {
  width: 17px;
  height: 17px;
  position: relative;
}
.nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
  flex: 1;
}
.nav-label {
  font-size: 11px;
  color: var(--muted);
  padding: 17px 13px 8px;
  letter-spacing: 0.6px;
}
.nav-item {
  height: 39px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 13px;
  border-radius: 10px;
  color: #516682;
  font-size: 13px;
  white-space: nowrap;
}
.nav-item:hover {
  background: #ffffff65;
}
.nav-item.active {
  background: linear-gradient(95deg, #edf5ff, #c8e0ff);
  color: #0a62e5;
  font-weight: 600;
}
.nav-item .badge {
  margin-left: auto;
}
.sidebar-bottom {
  margin-top: 12px;
  border-top: 1px solid #ffffff60;
  padding-top: 12px;
}
.user {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px 7px;
  text-align: left;
}
.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: white;
  background: #98a2eb;
  flex: none;
  font-weight: 500;
}
.user b {
  font-size: 12px;
  font-weight: 500;
}
.user small {
  display: block;
  font-size: 10px;
  margin-top: 4px;
}
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.globalbar {
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  gap: 12px;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--muted);
  font-size: 12px;
  min-width: 0;
}
.breadcrumb b {
  font-weight: 500;
  color: var(--ink);
}
.global-search {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12px;
  color: var(--muted);
  min-width: 260px;
  padding: 7px 11px;
  border: 1px solid #e0e8f1;
  border-radius: 9px;
  background: #ffffff70;
}
.global-search kbd {
  margin-left: auto;
  font-size: 10px;
  border: 1px solid #d6dfed;
  border-radius: 4px;
  padding: 1px 4px;
}
kbd {
  font-family: inherit;
}
.icon-btn {
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  border-radius: 9px;
  color: #506887;
  position: relative;
  flex: none;
}
.icon-btn:hover {
  background: var(--accent-soft);
  border-color: #dce7f7;
}
.icon-btn.round {
  border: 1px solid var(--line);
  background: #ffffff70;
}
.notification-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  position: absolute;
  right: 7px;
  top: 6px;
}
.env {
  padding: 4px 7px;
  background: #ffffff70;
  border: 1px solid #dbe4ef;
  border-radius: 5px;
  font-size: 10px;
  color: #718098;
}
.workspace {
  min-height: 0;
  flex: 1;
  display: flex;
  gap: 10px;
  position: relative;
}
.sessions {
  width: var(--session);
  flex: none;
  background: #ffffff80;
  border: 1px solid #ffffffba;
  border-radius: var(--r-lg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sessions-head {
  padding: 20px 17px 12px;
}
.sessions-head h2 {
  font-size: 17px;
}
.search {
  display: flex;
  gap: 7px;
  align-items: center;
  background: #edf2f980;
  border: 1px solid #e6ecf6;
  border-radius: 9px;
  padding: 0 10px;
  height: 34px;
  min-width: 0;
}
.search input {
  border: 0;
  background: none;
  padding: 0;
  width: 100%;
  outline: none;
  font-size: 12px;
}
.search:focus-within {
  outline: 2px solid #2674ed50;
  outline-offset: 1px;
}
.new-chat {
  margin-top: 13px;
  width: 100%;
  justify-content: center;
  color: var(--accent);
  background: #dbeaff;
  border: 1px solid #cce0fe;
}
.btn {
  height: 34px;
  padding: 0 12px;
  border-radius: var(--r-sm);
  display: inline-flex;
  gap: 6px;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  white-space: nowrap;
  border: 1px solid #e2e8f1;
  background: #fff;
  transition:
    background var(--motion),
    box-shadow var(--motion);
  font-weight: 500;
}
.btn:hover {
  background: var(--accent-soft);
  border-color: #cddffc;
}
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 2px 5px #2674ed20;
}
.btn.primary:hover {
  background: #1765dc;
}
.btn.danger {
  background: var(--danger);
  color: white;
  border-color: var(--danger);
}
.btn.soft {
  background: var(--surface-soft);
}
.btn.link {
  border: 0;
  background: none;
  color: var(--accent);
  padding: 0 4px;
}
.session-list {
  overflow: auto;
  padding: 0 11px 20px;
  flex: 1;
  overscroll-behavior: contain;
}
.date-group {
  font-size: 11px;
  color: var(--muted);
  padding: 18px 8px 7px;
}
.session-row {
  position: relative;
  display: flex;
  border-radius: 9px;
  margin: 2px 0;
  content-visibility: auto;
  contain-intrinsic-size: 0 60px;
}
.session-row.active {
  background: #deecff;
}
.session-row.active:before {
  content: "";
  width: 2px;
  height: calc(100% - 18px);
  background: var(--accent);
  position: absolute;
  left: -1px;
  top: 9px;
  border-radius: 2px;
}
.session-select {
  text-align: left;
  flex: 1;
  min-width: 0;
  padding: 12px 8px 10px;
  font-size: 12px;
  display: block;
}
.session-select span {
  white-space: nowrap;
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-right: 18px;
}
.session-select small {
  font-size: 10px;
  display: block;
  margin-top: 6px;
}
.session-row .more {
  position: absolute;
  right: 3px;
  top: 12px;
  width: 28px;
  height: 28px;
  opacity: 0.4;
}
.session-row:hover {
  background: #e8f1ff;
}
.session-row:hover .more {
  opacity: 1;
}
.chat-panel {
  flex: 1;
  min-width: 0;
  border: 1px solid #fff;
  border-radius: var(--r-lg);
  background: linear-gradient(130deg, #f7faffcc, #f1f6fcc9);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
.chat-header {
  padding: 17px 20px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #e7eef775;
  flex: none;
}
.agent-title {
  font-size: 15px;
  font-weight: 650;
  gap: 7px;
}
.agent-title button {
  padding: 0;
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  text-align: left;
}
.connected {
  font-size: 11px;
  color: var(--success);
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
  background: currentColor;
}
.resource-summary {
  display: flex;
  gap: 11px;
  margin-top: 7px;
  color: var(--muted);
  font-size: 10px;
  flex-wrap: wrap;
}
.resource-summary button {
  padding: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
}
.resource-summary .ico {
  width: 12px;
  height: 12px;
}
.chat-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 20px 23px 10px;
  overscroll-behavior: contain;
}
.chat-scroll > .turn {
  max-width: 800px;
  margin: 0 auto 22px;
}
.question-row {
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
  gap: 9px;
  margin-bottom: 22px;
}
.question-content {
  max-width: 88%;
}
.question {
  background: #dfeeff;
  border: 1px solid #d2e5ff;
  border-radius: 11px 11px 3px 11px;
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}
.question-time {
  text-align: right;
  color: var(--muted);
  font-size: 10px;
  margin-top: 5px;
}
.question-row .avatar {
  width: 29px;
  height: 29px;
  font-size: 12px;
}
.answer-row {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.answer-row > .ai-orb {
  width: 30px;
  height: 30px;
  margin-top: 4px;
}
.answer-content {
  flex: 1;
  min-width: 0;
}
.answer-card {
  background: #ffffffed;
  border: 1px solid #e7edf7;
  border-radius: 12px;
  box-shadow: 0 3px 10px #56739e04;
  overflow: hidden;
}
.run-summary {
  width: 100%;
  padding: 11px 15px;
  background: linear-gradient(110deg, #fafcff, #f3f7fc);
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 11px;
  border-bottom: 1px solid #f1f4fa;
  text-align: left;
}
.run-summary .done-check {
  color: var(--success);
  display: flex;
  gap: 5px;
  align-items: center;
}
.run-summary .link {
  color: var(--accent);
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 3px;
  white-space: nowrap;
}
.answer-body {
  padding: 17px 18px 16px;
  font-size: 13px;
  line-height: 1.8;
}
.answer-body h3 {
  margin-bottom: 6px;
}
.answer-body p {
  line-height: 1.8;
  margin-bottom: 13px;
}
.answer-body ul {
  list-style: none;
  padding: 0;
  margin: 7px 0 0;
}
.answer-body li {
  position: relative;
  padding-left: 15px;
  line-height: 1.75;
  margin: 2px 0;
}
.answer-body li:before {
  content: "";
  background: var(--accent);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  position: absolute;
  left: 1px;
  top: 10px;
}
.answer-body li b {
  font-weight: 550;
}
.cite {
  display: inline;
  padding: 1px 4px;
  border-radius: 4px;
  background: #e9f1ff;
  color: var(--accent);
  font-size: 10px;
  vertical-align: middle;
  margin: 0 2px;
}
.cite:hover {
  background: #cfe2ff;
}
.answer-footnote {
  font-size: 10px;
  color: #97a4b9;
  padding: 0 18px 10px;
}
.references {
  margin-top: 13px;
}
.references summary {
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  list-style: none;
  padding: 0 2px 8px;
}
.references summary:after {
  content: "⌄";
  color: var(--muted);
  margin-left: auto;
}
.count-tag {
  font-size: 10px;
  color: var(--accent);
  background: #e4efff;
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 500;
}
.source-list {
  background: #ffffff78;
  border: 1px solid #e9eff8;
  border-radius: 10px;
  overflow: hidden;
}
.source {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 9px 10px;
  border-bottom: 1px solid #edf2f9;
  text-align: left;
  font-size: 11px;
  min-width: 0;
}
.source:last-child {
  border-bottom: 0;
}
.source .file-icon {
  color: var(--accent);
}
.source .source-index {
  background: #e0e7f2;
  color: #516681;
  width: 22px;
  height: 17px;
  border-radius: 6px;
  text-align: center;
}
.source-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 48%;
}
.source-location {
  color: var(--muted);
  font-size: 10px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  flex: 1;
}
.source > .ico:last-child {
  width: 13px;
  height: 13px;
  margin-left: auto;
}
.message-actions {
  display: flex;
  gap: 6px;
  padding: 7px 0 0;
}
.message-actions .icon-btn {
  width: 29px;
  height: 29px;
}
.message-actions .ico {
  width: 16px;
  height: 16px;
}
.trace-steps {
  background: #f8fbff;
  padding: 14px 17px;
  font-size: 11px;
  display: grid;
  gap: 12px;
  border-bottom: 1px solid var(--line);
}
.trace-step {
  display: flex;
  gap: 8px;
  align-items: center;
}
.trace-step .ico {
  color: var(--success);
  width: 13px;
  height: 13px;
}
.trace-step span:last-child {
  margin-left: auto;
  color: var(--muted);
}
.composer-wrap {
  padding: 8px 12px 11px;
  flex: none;
}
.composer {
  max-width: 840px;
  margin: 0 auto;
  background: #ffffffef;
  border: 1px solid #e1e9f5;
  border-radius: 16px;
  padding: 11px 11px 10px;
  box-shadow: 0 3px 16px #31528106;
}
.composer:focus-within {
  border-color: #a9caff;
  box-shadow: 0 0 0 2px #2674ed08;
}
.composer-context {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.chip {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  max-width: 100%;
  padding: 4px 7px;
  border-radius: 7px;
  background: #f0f5fd;
  color: #486387;
  font-size: 10px;
}
.chip .ico {
  width: 13px;
  height: 13px;
}
.chip button {
  padding: 0;
  line-height: 1;
  display: flex;
}
.chip .ico:last-child {
  width: 11px;
  height: 11px;
}
.chip.skill {
  background: #eaf2ff;
  color: #315d9b;
}
.composer textarea {
  height: 41px;
  max-height: 140px;
  resize: none;
  width: 100%;
  border: 0;
  outline: none;
  background: none;
  padding: 5px 0;
  font-size: 12px;
  line-height: 1.6;
}
.composer-bottom {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.composer-bottom .btn {
  font-size: 10px;
  height: 30px;
  padding: 0 8px;
  color: #4d6282;
  background: #f4f7fc;
  border: 0;
}
.composer-bottom .btn.on {
  background: #e6f0ff;
  color: var(--accent);
}
.composer-bottom .btn.model {
  margin-left: auto;

  overflow: hidden;
}
.send {
  width: 35px;
  height: 33px;
  border-radius: 9px;
  color: white;
  background: #15294f;
  display: grid;
  place-items: center;
  flex: none;
}
.send:hover {
  background: var(--accent);
  color: white;
}
.send .ico {
  width: 17px;
  height: 17px;
}
.composer-note {
  font-size: 9px;
  color: #91a0b8;
  text-align: center;
  margin-top: 6px;
}
.viewer {
  width: var(--viewer);
  flex: none;
  border-radius: var(--r-lg);
  background: #ffffff78;
  border: 1px solid #ffffffba;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.viewer-head {
  padding: 17px 16px 11px;
}
.viewer-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
}
.viewer-title b {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.viewer-title > .ico {
  color: var(--accent);
}
.viewer-meta {
  font-size: 10px;
  color: var(--muted);
  margin: 5px 0 11px;
  padding-left: 26px;
}
.viewer-tools {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--muted);
}
.viewer-tools .icon-btn {
  border: 1px solid #dde7f5;
  width: 28px;
  height: 28px;
}
.viewer-tools input {
  width: 34px;
  text-align: center;
  padding: 4px;
  font-size: 10px;
}
.viewer-body {
  overflow: auto;
  padding: 0 14px 14px;
  flex: 1;
  min-height: 0;
}
.paper-viewport {
  overflow: auto;
  background: #e9eef730;
  border-radius: 12px;
}
.doc-paper {
  background: #fff;
  border: 1px solid #e6edf7;
  border-radius: 11px;
  padding: 29px 26px 25px;
  min-height: 385px;
  line-height: 1.7;
  box-shadow: var(--shadow);
  font-family: Arial, sans-serif;
  font-size: 11px;
  transform-origin: top left;
  overflow-wrap: anywhere;
}
.doc-paper h2 {
  font-size: 14px;
  margin: 0 0 17px;
}
.doc-paper h3 {
  font-size: 12px;
  margin-bottom: 17px;
}
.doc-paper p {
  margin-bottom: 16px;
  line-height: 1.75;
}
.doc-paper mark,
.quote-location mark {
  background: #ffedaa;
  color: #544b31;
  padding: 2px 0;
  box-shadow:
    2px 0 #ffedaa,
    -2px 0 #ffedaa;
}
.paper-footer {
  font-size: 8px;
  color: #929aab;
  border-top: 1px solid #e7ecf3;
  margin-top: 28px;
  padding-top: 9px;
  display: flex;
  justify-content: space-between;
}
.thumbnails {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin: 12px 0;
}
.thumbnail {
  text-align: center;
  color: var(--muted);
  padding: 0;
  font-size: 11px;
}
.mini-paper {
  height: 93px;
  background: #fff;
  border: 1px solid #e7edf6;
  border-radius: 7px;
  padding: 12px 8px;
  display: block;
  margin-bottom: 7px;
}
.thumbnail.active {
  color: var(--accent);
}
.thumbnail.active .mini-paper {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px #2674ed25;
}
.mini-paper i {
  height: 2px;
  background: #d9e0eb;
  margin-bottom: 4px;
  display: block;
}
.mini-paper i:nth-child(3n) {
  width: 77%;
}
.thumbnail.active .mini-paper i:nth-child(4),
.thumbnail.active .mini-paper i:nth-child(5) {
  background: #ffe296;
}
.quote-label {
  font-size: 11px;
  color: var(--muted);
  margin: 18px 0 9px;
}
.quote-location {
  background: #ffffffad;
  border: 1px solid #e7edf7;
  border-radius: 13px;
  padding: 13px;
  font-size: 11px;
  line-height: 1.7;
}
.quote-location h3 {
  font-size: 12px;
  font-weight: 500;
  margin-bottom: 9px;
}
.quote-location .flex {
  margin-top: 12px;
  font-size: 10px;
}
.content-surface {
  background: #f9fbfedb;
  border: 1px solid #fff;
  border-radius: var(--r-lg);
  overflow: auto;
  width: 100%;
  padding: 27px 30px;
  min-height: 0;
  overscroll-behavior: contain;
}
.page-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 23px;
}
.page-heading p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 7px;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0 0 17px;
  flex-wrap: wrap;
}
.toolbar .search {
  width: 260px;
  background: #fff;
}
.toolbar select {
  font-size: 12px;
  height: 34px;
  max-width: 190px;
}
.toolbar .view-switch {
  margin-left: auto;
  display: flex;
  background: #eef3fa;
  padding: 3px;
  border-radius: 8px;
  gap: 1px;
}
.view-switch button {
  width: 29px;
  height: 27px;
  border-radius: 5px;
  display: grid;
  place-items: center;
  color: var(--muted);
}
.view-switch button.active {
  background: #fff;
  color: var(--accent);
  box-shadow: 0 1px 5px #3250770c;
}
.table-wrap {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  overflow: auto;
}
.table-wrap table {
  border-collapse: collapse;
  width: 100%;
  text-align: left;
  font-size: 12px;
  white-space: nowrap;
}
.table-wrap th {
  height: 39px;
  background: #f7f9fd;
  color: #7a879c;
  font-weight: 500;
  padding: 0 15px;
  font-size: 11px;
  border-bottom: 1px solid var(--line);
}
.table-wrap td {
  height: 49px;
  padding: 0 15px;
  border-bottom: 1px solid #eff2f7;
  color: #4a5e7c;
}
.table-wrap tr:last-child td {
  border: 0;
}
.table-wrap tr:hover td {
  background: #f8fbff;
}
.table-wrap td b {
  color: var(--ink);
  font-weight: 550;
}
.table-name {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--ink);
  max-width: 290px;
  text-align: left;
  font-size: 12px;
}
.table-name .ico {
  color: #7396c5;
}
.table-name span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.table-actions {
  display: flex;
  gap: 3px;
}
.table-actions .icon-btn {
  width: 27px;
  height: 27px;
}
.table-actions .ico {
  width: 15px;
  height: 15px;
}
.badge {
  font-size: 10px;
  display: inline-flex;
  gap: 5px;
  align-items: center;
  background: #edf2f8;
  color: #55677f;
  padding: 4px 7px;
  border-radius: 6px;
  white-space: nowrap;
}
.badge.ready,
.badge.done,
.badge.connected {
  color: var(--success);
  background: var(--success-bg);
}
.badge.failed,
.badge.error,
.badge.auth {
  color: var(--danger);
  background: var(--danger-bg);
}
.badge.pending,
.badge.draft {
  color: var(--warning);
  background: var(--warning-bg);
}
.badge.processing,
.badge.connecting,
.badge.syncing {
  color: var(--accent);
  background: var(--accent-soft);
}
.badge .ico {
  width: 12px;
  height: 12px;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
  gap: 16px;
}
.card {
  padding: 20px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: 0 3px 15px #42618404;
  min-width: 0;
}
.card:hover {
  border-color: #cddff4;
}
.card-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 13px;
}
.card-head h3 {
  margin-bottom: 5px;
}
.card p {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.7;
  min-height: 40px;
}
.card .badge {
  margin-left: auto;
}
.card-info {
  margin: 15px 0;
  display: grid;
  gap: 8px;
  font-size: 11px;
  color: #657796;
}
.card-info .flex span:last-child {
  margin-left: auto;
  color: var(--ink);
}
.card-foot {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  color: var(--muted);
  gap: 8px;
}
.skill-icon {
  display: grid;
  place-items: center;
  width: 37px;
  height: 37px;
  background: #eff5ff;
  color: #6589c2;
  border-radius: 11px;
  flex: none;
}
.card-head small {
  font-size: 10px;
}
.tabs {
  display: flex;
  gap: 23px;
  border-bottom: 1px solid #e1e8f3;
  margin-bottom: 22px;
  overflow: auto;
}
.tabs button,
.tabs a {
  padding: 0 2px 12px;
  font-size: 12px;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  color: var(--muted);
}
.tabs .active {
  color: var(--accent);
  border-color: var(--accent);
  font-weight: 600;
}
.detail-back {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 15px;
}
.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}
.metric {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 17px 18px;
  text-align: left;
  min-width: 0;
}
.metric-label {
  font-size: 11px;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.metric-label .ico {
  width: 15px;
  height: 15px;
  color: #9aabc2;
}
.metric b {
  display: block;
  font-size: 26px;
  font-weight: 650;
  color: var(--ink);
  margin: 10px 0 8px;
  letter-spacing: -0.5px;
}
.metric small {
  font-size: 10px;
}
.metric.action:hover {
  border-color: #accaf3;
  background: #fbfdff;
}
.metric.warning b {
  color: var(--warning);
}
.metric.danger b {
  color: var(--danger);
}
.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 18px;
  margin-bottom: 22px;
}
.panel {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: var(--r);
  padding: 20px;
  min-width: 0;
}
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  gap: 10px;
}
.panel-head h2 {
  font-size: 15px;
}
.panel-head small {
  font-size: 10px;
}
.trend {
  height: 185px;
  width: 100%;
  display: block;
  color: var(--accent);
  overflow: visible;
}
.chart-labels {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--muted);
  margin-top: 10px;
}
.insight {
  background: linear-gradient(125deg, #fcfaff, #f7fbff);
  border-color: #e5e9f8;
}
.insight-item {
  display: flex;
  gap: 10px;
  padding: 12px 0;
  font-size: 12px;
  border-bottom: 1px solid var(--line);
  align-items: flex-start;
}
.insight-item p {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.7;
}
.insight-item > .ico {
  color: var(--accent);
  width: 16px;
  height: 16px;
  margin-top: 3px;
}
.progress {
  height: 4px;
  border-radius: 3px;
  background: #edf2f9;
  overflow: hidden;
  margin: 13px 0;
}
.progress span {
  display: block;
  height: 100%;
  background: #83b0ef;
  border-radius: 3px;
  transition: width var(--motion);
}
.setting-layout {
  display: grid;
  grid-template-columns: 175px minmax(0, 1fr);
  gap: 27px;
}
.setting-nav {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.setting-nav button {
  padding: 11px 13px;
  text-align: left;
  border-radius: 8px;
  font-size: 12px;
  color: #637694;
}
.setting-nav button.active {
  background: var(--accent-soft);
  color: var(--accent);
}
.form-panel {
  max-width: 790px;
  background: white;
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 23px;
}
.form-panel h2 {
  font-size: 16px;
  margin-bottom: 7px;
}
.form-panel > p {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 20px;
}
.field {
  display: grid;
  gap: 7px;
  margin-bottom: 17px;
}
.field > label {
  font-size: 12px;
  font-weight: 550;
}
.field input,
.field textarea,
.field select {
  width: 100%;
  font-size: 12px;
}
.field .error-text {
  color: var(--danger);
  font-size: 11px;
}
.field small {
  font-size: 10px;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}
.checks {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 8px;
}
.checks label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 11px;
}
.checks input {
  margin: 0;
  accent-color: var(--accent);
}
.setting-row {
  display: flex;
  gap: 18px;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.setting-row > div {
  flex: 1;
}
.setting-row p {
  color: var(--muted);
  font-size: 11px;
  margin-top: 5px;
}
.setting-row input[type="checkbox"] {
  accent-color: var(--accent);
  width: 16px;
  height: 16px;
}
.empty {
  padding: 50px 15px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 11px;
  grid-column: 1/-1;
}
.empty > .ico {
  width: 29px;
  height: 29px;
  color: #a2b5cf;
}
.empty h3 {
  font-size: 14px;
}
.empty p {
  font-size: 12px;
  color: var(--muted);
  max-width: 330px;
}
.welcome {
  max-width: 640px;
  padding: 42px 6px 26px;
  margin: auto;
}
.welcome > .ai-orb {
  width: 47px;
  height: 47px;
  margin-bottom: 20px;
}
.welcome h1 {
  font-size: 22px;
  margin-bottom: 10px;
}
.welcome > p {
  font-size: 12px;
  color: var(--muted);
}
.suggestions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 25px 0 20px;
}
.suggestion {
  padding: 15px;
  background: #ffffff9e;
  border: 1px solid #e2eaf6;
  border-radius: 12px;
  text-align: left;
}
.suggestion span {
  display: block;
  color: var(--accent);
  font-size: 11px;
  margin-bottom: 9px;
}
.suggestion p {
  font-size: 12px;
  line-height: 1.7;
}
.suggestion:hover {
  border-color: #b0ccf5;
  box-shadow: var(--shadow);
}
.pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--muted);
  font-size: 11px;
  padding-top: 14px;
}
.pagination .btn {
  height: 27px;
}
.overlay {
  position: fixed;
  inset: 0;
  background: #1c355e30;
  z-index: 70;
  display: grid;
  place-items: center;
  padding: 20px;
  backdrop-filter: blur(3px);
}
.modal {
  width: min(620px, 100%);
  max-height: 90dvh;
  display: flex;
  flex-direction: column;
  background: #fff;
  border: 1px solid #fff;
  border-radius: 18px;
  box-shadow: var(--shadow-pop);
  overflow: hidden;
}
.modal-head {
  padding: 22px 24px 17px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.modal-head h2 {
  font-size: 18px;
  margin-bottom: 7px;
}
.modal-head p {
  font-size: 12px;
  color: var(--muted);
}
.modal-body {
  padding: 5px 24px 20px;
  overflow: auto;
  overscroll-behavior: contain;
}
.modal-foot {
  border-top: 1px solid var(--line);
  padding: 14px 24px;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: #fbfcfe;
}
.modal-foot small {
  margin-right: auto;
  align-self: center;
}
.popover {
  position: fixed;
  z-index: 85;
  background: #fff;
  border: 1px solid #e2e9f3;
  border-radius: 12px;
  box-shadow: var(--shadow-pop);
  padding: 6px;
  min-width: 180px;
  max-width: calc(100vw - 24px);
}
.popover button {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  text-align: left;
  padding: 9px 10px;
  font-size: 12px;
  border-radius: 7px;
}
.popover button:hover {
  background: var(--accent-soft);
}
.popover button small {
  margin-left: auto;
  font-size: 10px;
}
.popover .danger-text {
  color: var(--danger);
}
.popover .menu-heading {
  padding: 9px 10px;
  color: var(--muted);
  font-size: 10px;
}
.popover .model-option {
  display: block;
}
.model-option b {
  font-weight: 550;
  display: block;
  margin-bottom: 4px;
}
.model-option span {
  font-size: 10px;
  color: var(--muted);
}
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: #1c355e20;
  z-index: 60;
  display: flex;
  justify-content: flex-end;
}
.drawer {
  width: min(470px, 100%);
  background: #fcfdff;
  height: 100%;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-pop);
  animation: drawer-in var(--motion) ease-out;
}
.drawer .modal-head {
  border-bottom: 1px solid var(--line);
}
.drawer-body {
  padding: 24px;
  overflow: auto;
  flex: 1;
  overscroll-behavior: contain;
}
.drawer .section {
  margin-bottom: 24px;
}
.section h3 {
  font-size: 12px;
  margin-bottom: 10px;
  color: var(--muted);
  font-weight: 500;
}
.kv {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 12px;
  font-size: 12px;
  margin-bottom: 12px;
}
.kv dt {
  color: var(--muted);
}
.kv dd {
  margin: 0;
  overflow-wrap: anywhere;
}
.drawer .chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.drawer-footer {
  border-top: 1px solid var(--line);
  padding: 17px 24px;
  display: flex;
  gap: 9px;
}
.toast-stack {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: grid;
  gap: 8px;
  max-width: 90vw;
}
.toast {
  display: flex;
  align-items: center;
  gap: 9px;
  border: 1px solid #e1e8f3;
  background: #fff;
  border-radius: 10px;
  box-shadow: var(--shadow-pop);
  padding: 12px 15px;
  font-size: 12px;
  animation: toast-in var(--motion) ease-out;
  min-width: 220px;
}
.toast.success > .ico {
  color: var(--success);
}
.toast.error > .ico {

.agent-feature-card:hover { border-color: #bfd2ed; box-shadow: 0 6px 18px #2d4d7010; }
.agent-feature-top { display: flex; align-items: flex-start; gap: 11px; }
.agent-feature-top .ai-orb { width: 36px; height: 36px; }
.agent-feature-title { flex: 1; min-width: 0; }
.agent-feature-title button { max-width: 100%; text-align: left; }
.agent-feature-title h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.agent-feature-card > p { min-height: 38px; margin-top: 12px; color: #52647e; font-size: 11px; line-height: 1.65; }
.agent-business-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.agent-business-metrics div { min-width: 0; }
.agent-business-metrics span { display: block; color: var(--muted); font-size: 9px; }
.agent-business-metrics strong { display: block; overflow: hidden; margin-top: 2px; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
.agent-tech-meta { margin-top: 13px; padding-top: 10px; border-top: 1px solid #edf0f4; color: #667891; font-size: 9px; }
.agent-feature-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.agent-management-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.agent-management-toolbar .search { width: 260px; background: #fff; }
.agent-management-toolbar .view-switch { margin-left: auto; }
.agent-table-purpose { max-width: 270px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #52647e; }
.health { display: inline-flex; align-items: center; gap: 5px; color: var(--success); font-weight: 600; }
.health::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.health.warning { color: var(--warning); }
.top-agent,
.resource-counts {
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 0 9px;
  border-radius: 8px;
  color: var(--text);
}
.top-agent:hover,
.resource-counts:hover {
  background: var(--blue-50);
  color: var(--blue-600);
}
.top-agent .ai-orb {
  width: 28px;
  height: 28px;
}
.resource-counts {
  color: var(--muted);
  font-size: 12px;
}
.resource-counts .ico {
  margin-left: 2px;
}
.welcome-label {
  margin: 24px 0 10px;
  color: var(--ink);
  font-size: 13px;
  font-weight: 650;
  text-align: left;
}
.graph-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 260px;
  gap: 16px;
}
.graph-canvas {
  position: relative;
  min-height: 590px;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 45%, #eef5ff, transparent 42%),
    linear-gradient(#fff, #f8fbff);
}
.graph-canvas > svg {
  position: absolute;
  inset: 5%;
  width: 90%;
  height: 90%;
}
.graph-canvas line {
  stroke: #aec4df;
  stroke-width: .35;
  stroke-dasharray: 1.2 1.2;
}
.graph-node {
  position: absolute;
  min-width: 96px;
  min-height: 52px;
  display: grid;
  place-items: center;
  transform: translate(-50%, -50%);
  padding: 8px 10px;
  border: 1px solid #a9c5eb;
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 6px 18px #27486b18;
  text-align: center;
}
.graph-node:hover { transform: translate(-50%, -50%) scale(1.03); }
.graph-node span { font-size: 12px; font-weight: 650; }
.graph-node small { margin-top: 2px; color: var(--muted); font-size: 10px; }
.graph-node.standard { border-color: #6799e8; background: #edf4ff; }
.graph-node.concept { border-color: #8e83d9; background: #f2efff; }
.graph-node.entity { border-color: #54a685; background: #ecf8f3; }
.graph-node.interface { border-color: #d59745; background: #fff6e6; }
.graph-node.system { border-color: #d16a89; background: #fff0f4; }
.graph-side { align-self: start; }
.graph-side h2 { margin-bottom: 16px; }
.graph-side h3 { margin: 22px 0 10px; font-size: 13px; }
.metric-list { display: grid; gap: 10px; }
.metric-list > div { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 9px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.metric-list strong { color: var(--ink); }
.graph-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; color: var(--muted); font-size: 11px; }
.graph-legend span { display: flex; align-items: center; gap: 6px; }
.graph-legend i { width: 9px; height: 9px; border-radius: 50%; background: #6799e8; }
.graph-legend i.concept { background: #8e83d9; }
.graph-legend i.entity { background: #54a685; }
.graph-legend i.interface { background: #d59745; }
.graph-legend i.system { background: #d16a89; }
.table-wrap th { color: #5b6b83; }
.panel .muted span[style] { color: #455b78 !important; }
.aip06-rail {
  width: 52px;
  flex: none;
  display: grid;
  align-content: start;
  gap: 7px;
  padding: 12px 6px;
  border: 1px solid #fff;
  border-radius: var(--r-lg);
  background: #ffffff80;
}
.aip06-rail button {
  min-height: 48px;
  display: grid;
  place-items: center;
  gap: 2px;
  border-radius: 9px;
  color: var(--muted);
  font-size: 9px;
}
.aip06-rail button:hover { color: var(--accent); background: var(--accent-soft); }
.aip06-rail .ico { width: 18px; height: 18px; }
@media (max-width: 767px) {
  .resource-counts { display: none; }
  .top-agent b { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-sub { margin-left: 24px; }
  .content-surface:has(.agents-workspace) { overflow: auto; }
  .agents-workspace { display: block; height: auto; min-height: 100%; }
  .agents-module-nav { display: none; }
  .agents-main { overflow: visible; padding: 22px 16px 36px; }
  .agents-page-head { align-items: flex-start; gap: 16px; }
  .agents-page-head h1 { font-size: 21px; }
  .agent-overview-strip { grid-template-columns: 1fr 1fr; }
  .agent-overview-item { padding: 11px 14px; }
  .agent-overview-item:nth-child(2) { border-right: 0; }
  .agent-overview-item:nth-child(-n + 2) { border-bottom: 1px solid #e2e8f1; }
  .agent-next { align-items: flex-start; flex-wrap: wrap; }
  .completion-bar { width: 100%; }
  .setup-flow { grid-template-columns: 1fr 1fr; }
  .agent-feature-grid { grid-template-columns: 1fr; }
  .agent-management-toolbar .search { width: 100%; }
  .agent-management-toolbar .view-switch { margin-left: 0; }
  .graph-layout { grid-template-columns: 1fr; }
  .graph-canvas { min-height: 500px; }
  .graph-side, .aip06-rail { display: none; }
  .graph-node { min-width: 78px; min-height: 46px; padding: 6px 8px; }
}

@media (min-width: 768px) and (max-width: 1100px) {
  .agents-workspace { grid-template-columns: 170px minmax(0, 1fr); }
  .agents-main { padding: 26px 24px 40px; }
  .agent-feature-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

      pending = docs.filter((d) => d.status === "pending").length,
      processing = docs.filter((d) => d.status === "processing").length;
    return {
      docs: docs.length,
      done: done.length,
      failed,
      pending,
      processing,
      chunks: done.reduce((n, d) => n + d.chunks, 0),
      tokens: done.reduce((n, d) => n + d.tokens, 0),
      status: failed

        : processing
          ? "processing"
          : pending
            ? "pending"
            : docs.length
              ? "done"
              : "pending",

  function processFiles(files) {
    const target = state.uploadTarget;
    if (!target) return;
    const total = state.uploadItems.length;
    if (total + files.length > 10) {
      toast("单次最多上传 10 份文件。", "warning");
      return;
    }
    Array.from(files).forEach((f) => {
      const item = {
        id: uid("up"),
        name: f.name,
        size: (f.size / 1048576).toFixed(2) + " MB",
        status: "processing",
        stage: "上传中",
        progress: 0,
      };
      state.uploadItems.push(item);
      if (
        !/\.(pdf|docx|txt|md)$/i.test(f.name) ||
        f.size > 104857600 ||
        !f.size
      ) {
        item.status = "failed";
        item.error =
          f.size > 104857600
            ? "文件超过 100 MB 上限。"
            : !f.size
              ? "文件为空，请选择包含内容的文件。"
              : "格式不支持，请选择 PDF、DOCX、TXT 或 MD。";
        toast(item.error, "error");
        return;
      }
      const task = {
        id: uid("task"),
        name: f.name,
        kind: target === "chat" ? "附件上传" : "文档上传与解析",
        kb: target === "chat" ? null : target,
        status: "processing",
        progress: 0,
        time: now(),
      };
      db.tasks.unshift(task);
      let doc;
      if (target !== "chat") {
        doc = {
          id: uid("upload"),
          kb: target,
          name: f.name,
          size: item.size,
          status: "pending",
          chunks: 0,
          tokens: 0,
          updated: now(),
          total: 26,
          version: "V1.0",
        };
        db.documents.push(doc);
        task.doc = doc.id;
      } else task.session = db.ui.session;
      save();
      const timer = setInterval(() => {
        if (
          task.status !== "processing" ||
          !db.tasks.includes(task) ||
          (target !== "chat" && !get("knowledge", target))
        ) {
          clearInterval(timer);
          return;
        }
        item.progress = Math.min(100, item.progress + 10);
        task.progress = item.progress;
        if (item.progress >= 50) {
          item.stage = "解析中";
          if (doc) doc.status = "processing";
        }
        if (item.progress === 100) {
          clearInterval(timer);
          item.status = "done";
          task.status = "done";
          if (doc) {
            doc.status = "done";
            doc.chunks = 42;
            doc.tokens = 12480;
            get("knowledge", target).updated = now();
          } else {
            const c =
              db.contexts[task.session] ||
              (db.contexts[task.session] = {
                skill: null,
                attachments: [],
                web: false,
              });
            c.attachments.push({ name: f.name, size: item.size });
            if (db.ui.session === task.session && state.route === "chat")
              updateContext();
          }
          save();
          notify(
            target === "chat" ? "附件上传完成" : "知识文档解析完成",
            f.name +
              " 已可用于" +
              (target === "chat" ? "当前对话" : "知识检索"),
            target === "chat"
              ? "chat"
              : "knowledge?id=" + target + "&tab=documents",
          );
          toast(f.name + " 已处理完成");
        }
        updateTaskUI();
      }, 220);
    });
    if ($(".upload-list")) $(".upload-list").innerHTML = uploadList();
  }

            .map(
              ([h, p]) =>
                `<div><h3>${h}</h3><p class="muted" style="margin-top:7px">${p}</p></div>`,
            )
            .join(
              "",
            )}<div class="callout">快捷键：Enter 发送；Shift + Enter 换行；Esc 关闭弹窗。</div></div>`,
        );
        break;
      case "prototype-logout":
        closeMenu();
        toast("交互原型未连接登录服务。", "info");
        break;
      default:
        console.warn("Unknown action", name);
    }
  }
  document.addEventListener("pointerdown", (e) => {
    const handle = e.target.closest(".session-resize");
    if (!handle || innerWidth < 1200) return;
    e.preventDefault();
    const width = $(".sessions").getBoundingClientRect().width,
      start = e.clientX;
    const move = (ev) => {
      db.ui.sessionWidth = Math.max(
        200,
        Math.min(360, width + ev.clientX - start),
      );
      $("#app").style.setProperty("--session", db.ui.sessionWidth + "px");
      handle.setAttribute("aria-valuenow", db.ui.sessionWidth);
    };
    const end = () => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", end);
      document.body.style.userSelect = "";
      save();
    };
    document.body.style.userSelect = "none";
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", end, { once: true });
  });
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-action]");
    if (t) {
      e.preventDefault();
      action(t.dataset.action, t.dataset.id, t);
      return;
    }
    if (e.target.dataset.overlay) {
      if (e.target.dataset.overlay === "modal") closeModal();
      if (e.target.dataset.overlay === "palette") closeCommand();
      if (e.target.dataset.overlay === "drawer") closeDrawer();
    } else if (!e.target.closest(".popover")) closeMenu();
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "prompt") {
      db.drafts[db.ui.session] = t.value;
      save();
      t.style.height = "41px";
      t.style.height = Math.min(140, t.scrollHeight) + "px";
    }
    if (t.id === "session-search") {
      state.sessionQuery = t.value;
      $("#session-list").innerHTML = renderSessions();
    }
    if (t.id === "page-search") {
      state.filters.q = t.value;
      state.docPage = 1;
      const start = t.selectionStart;
      const scroll = $(".content-surface")?.scrollTop || 0;
      render();
      const input = $("#page-search");
      input?.focus();
      input?.setSelectionRange(start, start);
      if ($(".content-surface")) $(".content-surface").scrollTop = scroll;
    }
    if (t.id === "command-input") {
      state.paletteIndex = 0;
      commandResults(t.value);
    }
    if (t.id === "find-chat-input") {
      $("#find-chat-results").innerHTML =
        session()
          .messages.filter((m) => m.question.includes(t.value))
          .map((m) => btn(esc(m.question), "jump-message", m.id, "link"))
          .join("") || empty("无匹配消息", "请更换关键词。");
    }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id.startsWith("filter-")) {
      state.filters[t.id.slice(7)] = t.value;
      state.docPage = 1;
      render();
    }
    if (t.id === "doc-page-input") {
      const d = get("documents", state.viewer.doc);
      state.viewer.page = Math.max(1, Math.min(d.total, Number(t.value) || 1));
      updateViewer();
    }
    if (t.id === "file-input") {
      processFiles(t.files);
      t.value = "";
    }
  });
  document.addEventListener("keydown", (e) => {
    if (
      e.target.classList.contains("session-resize") &&
      ["ArrowLeft", "ArrowRight"].includes(e.key)
    ) {
      e.preventDefault();
      db.ui.sessionWidth = Math.max(
        200,
        Math.min(
          360,
          (db.ui.sessionWidth || 238) + (e.key === "ArrowRight" ? 10 : -10),
        ),
      );
      $("#app").style.setProperty("--session", db.ui.sessionWidth + "px");
      e.target.setAttribute("aria-valuenow", db.ui.sessionWidth);
      save();
      return;
    }
    if (e.key === "Escape") {
      if ($("#palette-root").children.length) closeCommand();
      else if ($("#modal-root").children.length) closeModal();
      else if ($("#drawer-root").children.length) closeDrawer();
      else if ($("#menu-root").children.length) closeMenu();
      else {
        $("#app").classList.remove("nav-open", "sessions-open");
        if (innerWidth < 768 && state.viewer.open) {
          state.viewer.open = false;
          $(".viewer")?.remove();
        }
      }
      return;
    }
    if (
      $("#command-input") &&
      ["ArrowDown", "ArrowUp", "Enter"].includes(e.key)
    ) {
      e.preventDefault();
      if (e.key === "Enter") openCommand(state.paletteIndex);
      else {
        state.paletteIndex = Math.max(
          0,
          Math.min(
            state.paletteResults.length - 1,
            state.paletteIndex + (e.key === "ArrowDown" ? 1 : -1),
          ),
        );
        highlightCommand();
      }
      return;
    }
    if (
      e.target.id === "prompt" &&
      e.key === "Enter" &&
      !e.shiftKey &&
      !e.isComposing
    ) {
      e.preventDefault();
      sendMessage();
      return;
    }
    const overlay =
      $("#palette-root .modal") ||
      $("#modal-root .modal") ||
      $("#drawer-root .drawer");
    if (overlay && e.key === "Tab") {
      const items = $$(
        'button:not(:disabled),input,textarea,select,a[href],[tabindex="0"]',
        overlay,
      ).filter((el) => el.offsetParent !== null);
      const first = items[0],
        last = items.at(-1);
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last?.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first?.focus();
      }
    }
    if ($("#popover") && ["ArrowDown", "ArrowUp"].includes(e.key)) {
      const items = $$("button", $("#popover"));
      const i = items.indexOf(document.activeElement);
      e.preventDefault();
      items[
        (i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length
      ]?.focus();
    }
  });
  document.addEventListener("dragover", (e) => {
    const zone = e.target.closest(".upload-zone");
    if (zone) {
      e.preventDefault();
      zone.classList.add("drag");
    }
  });
  document.addEventListener("dragleave", (e) =>
    e.target.closest(".upload-zone")?.classList.remove("drag"),
  );
  document.addEventListener("drop", (e) => {
    const zone = e.target.closest(".upload-zone");
    if (zone) {
      e.preventDefault();
      zone.classList.remove("drag");
      processFiles(e.dataTransfer.files);
    }
  });
  let hoverTimer;
  document.addEventListener("mouseover", (e) => {
    const cite = e.target.closest("[data-preview]"),
      tip = e.target.closest("[data-tooltip]");
    if (!cite && !tip) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(() => {
      const t = cite || tip;
      if (!t.isConnected) return;
      const r = t.getBoundingClientRect();
      if (cite) {
        const i = Number(cite.dataset.preview),
          d = get("documents", cite.dataset.id),
          ci = citationInfo[i % 3];
        $("#preview-root").innerHTML =
          `<div class="hover-preview" style="left:${Math.min(r.left, innerWidth - 272)}px;top:${Math.max(10, r.top - 95)}px"><b>${esc(d?.name || "来源文档已删除")}</b><p>第 ${ci.page} 页 · ${ci.section}</p><p>点击打开原文并高亮对应段落</p></div>`;
      } else
        $("#preview-root").innerHTML =
          `<div class="tooltip" style="left:${Math.max(5, Math.min(r.left, innerWidth - 190))}px;top:${r.bottom + 5}px">${esc(tip.dataset.tooltip)}</div>`;
    }, 350);
  });
  document.addEventListener("mouseout", (e) => {
    if (e.target.closest("[data-preview],[data-tooltip]")) {
      clearTimeout(hoverTimer);
      $("#preview-root").innerHTML = "";
    }
  });
  window.addEventListener("hashchange", () => {
    readRoute();
    closeDrawer();
    closeModal();
    render(true);
  });
  window.addEventListener("offline", () =>
    toast("网络已断开，当前本地数据仍可访问。", "warning"),
  );
  window.addEventListener("online", () => toast("网络连接已恢复。"));
  window.addEventListener("resize", () => {
    if (innerWidth >= 1200) $("#app").classList.remove("sessions-open");
    if (innerWidth >= 768) $("#app").classList.remove("nav-open");
  });
  readRoute();
  if (!location.hash) history.replaceState(null, "", "#" + state.route);
  if (innerWidth < 768) state.viewer.open = false;
  render();
  save();
})();

</script>
  </body>
</html>
